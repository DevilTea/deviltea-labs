name: Publish package

on:
  push:
    tags:
      - 'eslint-config@*'
      - 'tsconfig@*'
      - 'vue-router-middleware@*'
      - 'vue-temp-var@*'
      - 'tiny-state-machine@*'
      - 'spec-tool@*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      id: ${{ steps.target.outputs.id }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          pnpm-version: 10.34.4
          registry-url: https://registry.npmjs.org
          cache: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and resolve package
        id: target
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          package_id="$(pnpm exec tsx scripts/release-package.ts verify-tag "$GITHUB_REF_NAME")"
          package_name="$(pnpm exec tsx scripts/release-package.ts package-name "$package_id")"
          package_path="$(pnpm exec tsx scripts/release-package.ts package-path "$package_id")"
          version="$(pnpm exec tsx scripts/release-package.ts version "$package_id")"
          {
            echo "id=$package_id"
            echo "name=$package_name"
            echo "path=$package_path"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify workspace
        run: pnpm check

      - name: Pack release tarballs
        id: tarball
        env:
          PACKAGE_ID: ${{ steps.target.outputs.id }}
          PACKAGE_PATH: ${{ steps.target.outputs.path }}
        run: |
          destination="$RUNNER_TEMP/package"
          mkdir -p "$destination"
          pnpm --dir "$PACKAGE_PATH" pack --pack-destination "$destination"

          tarballs=("$destination"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "Expected one tarball in $destination" >&2
            exit 1
          fi
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGE_ID" = "tiny-state-machine" ]; then
            vue_path="$(pnpm exec tsx scripts/release-package.ts package-path tiny-state-machine-vue)"
            mkdir -p "$RUNNER_TEMP/fsm-vue"
            pnpm --dir "$vue_path" pack --pack-destination "$RUNNER_TEMP/fsm-vue"
            node scripts/verify-fsm-tarballs.mjs "${tarballs[0]}" "$RUNNER_TEMP/fsm-vue"/*.tgz
          fi

      - name: Retain verified Vue tarball
        if: steps.target.outputs.id == 'tiny-state-machine'
        uses: actions/upload-artifact@v6
        with:
          name: fsm-vue-release-tarball
          path: ${{ runner.temp }}/fsm-vue/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Publish with npm trusted publishing
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: npm publish "$TARBALL" --access public --provenance

  publish-fsm-vue:
    name: Publish matching FSM Vue adapter
    needs: publish
    if: needs.publish.outputs.id == 'tiny-state-machine'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download verified Vue tarball
        uses: actions/download-artifact@v6
        with:
          name: fsm-vue-release-tarball
          path: ${{ runner.temp }}/fsm-vue
      - name: Publish with npm trusted publishing
        run: |
          tarballs=("$RUNNER_TEMP"/fsm-vue/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "Expected exactly one verified Vue tarball" >&2
            exit 1
          fi
          npm publish "${tarballs[0]}" --access public --provenance
