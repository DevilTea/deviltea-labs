name: Pages integration

on:
  push:
    branches:
      - main
    paths:
      - apps/widget-lab/**
      - docs/site/**
      - scripts/build-pages.ts
      - .github/workflows/pages-integration.yml
      - pnpm-lock.yaml
  pull_request:
    paths:
      - apps/widget-lab/**
      - docs/site/**
      - scripts/build-pages.ts
      - .github/workflows/pages-integration.yml
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-contracts:
    name: Built Pages navigation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          pnpm-version: 10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build combined GitHub Pages artifact
        run: pnpm docs:build:pages

      - name: Install Playwright Chromium
        run: pnpm --filter widget-lab exec playwright install --with-deps chromium

      - name: Run standalone navigation contracts
        run: pnpm --filter widget-lab run test:pages

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: widget-lab-pages-playwright-report
          path: apps/widget-lab/test-results
          if-no-files-found: ignore
          retention-days: 7
