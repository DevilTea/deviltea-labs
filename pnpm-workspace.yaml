# Supply-chain security baseline retained from the source workspaces.
blockExoticSubdeps: true

minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@deviltea/eslint-config'
  - '@deviltea/tsconfig'

trustPolicy: no-downgrade
shellEmulator: true
strictDepBuilds: true

packages:
  - 'packages/*'
  - 'docs/*'

overrides:
  nanoid: 3.3.18

ignoredBuiltDependencies:
  - esbuild
  - simple-git-hooks
  - unrs-resolver

onlyBuiltDependencies: []

catalog:
  '@antfu/eslint-config': 10.0.0
  '@clack/prompts': ^1.9.0
  '@stryker-mutator/core': 10.1.1
  '@stryker-mutator/vitest-runner': 10.1.1
  '@types/node': ^24.19.2
  '@vitest/coverage-v8': 5.1.1
  ajv: ^8.20.0
  bumpp: 12.3.0
  eslint: 10.15.0
  fast-check: ^4.11.0
  lint-staged: ^17.6.2
  pathe: ^2.0.3
  publint: ^0.3.25
  rimraf: ^6.1.4
  simple-git-hooks: ^2.14.0
  tsdown: ^0.23.7
  tsx: ^4.23.15
  typescript: ^6.0.3
  unplugin-vue: ^8.0.1
  vite: ^8.3.8
  vitepress: 2.0.0-alpha.20
  vitest: 5.1.1
  vue: ^3.5.46
  vue-router: 5.5.1
  vue-tsc: ^3.3.14
  yaml: ^2.9.1
  zx: ^8.8.5
