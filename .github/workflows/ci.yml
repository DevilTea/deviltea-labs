name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify workspace (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}
          pnpm-version: 10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm check

  typescript-latest:
    name: Verify tsconfig (latest TypeScript 6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          pnpm-version: 10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tsconfig contracts
        run: node packages/tsconfig/scripts/test-contracts.mjs --typescript 6

  typescript-canary:
    name: Verify tsconfig (TypeScript next canary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          pnpm-version: 10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tsconfig contracts
        run: node packages/tsconfig/scripts/test-contracts.mjs --typescript next

  ef-pack:
    name: Pack @deviltea/ef (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          pnpm-version: 10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @deviltea/ef
        run: pnpm --filter @deviltea/ef build

      - name: Pack @deviltea/ef
        working-directory: packages/ef
        run: pnpm pack --pack-destination "$GITHUB_WORKSPACE/ef-tarball"

      - name: Upload packed tarball
        uses: actions/upload-artifact@v6
        with:
          name: ef-tarball
          path: ef-tarball/*.tgz
          if-no-files-found: error
          retention-days: 1

  ef-cli:
    name: Packed-consumer CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: ef-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}
          pnpm-version: 10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packed tarball
        uses: actions/download-artifact@v6
        with:
          name: ef-tarball
          path: ef-tarball

      - name: Locate packed tarball
        id: tarball
        shell: bash
        run: |
          tarball="$(find ef-tarball -maxdepth 2 -name '*.tgz' | head -n 1)"
          if [ -z "$tarball" ]; then
            echo "No tarball found under ef-tarball/" >&2
            exit 1
          fi

          # `pwd -W` prints the native Windows form (e.g. `C:/...`) under Git
          # Bash on windows-latest, where plain `pwd` would print an MSYS-only
          # path that Node.js cannot resolve; it is not a valid option on
          # Ubuntu/macOS bash, so fall back to plain `pwd` there.
          absolute_directory="$(cd "$(dirname "$tarball")" && { pwd -W 2>/dev/null || pwd; })"
          echo "path=$absolute_directory/$(basename "$tarball")" >> "$GITHUB_OUTPUT"

      - name: Run packed-consumer CLI smoke test
        env:
          EF_SMOKE_TARBALL: ${{ steps.tarball.outputs.path }}
        run: node packages/ef/test/package-smoke.mjs
