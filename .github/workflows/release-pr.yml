name: Create release PR

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - eslint-config
          - tsconfig
          - vue-router-middleware
          - vue-temp-var
          - tiny-state-machine
          - tiny-state-machine-vue
      release:
        description: Bumpp release type (patch, minor, major, prerelease) or exact version
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  create:
    name: Create ${{ inputs.package }} release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          pnpm-version: 10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump the selected package
        id: target
        env:
          PACKAGE_ID: ${{ inputs.package }}
          RELEASE: ${{ inputs.release }}
        run: |
          package_path="$(pnpm exec tsx scripts/release-package.ts package-path "$PACKAGE_ID")"
          pnpm exec bumpp "$package_path/package.json" --release "$RELEASE" --no-commit --no-tag --no-push --yes

          version="$(pnpm exec tsx scripts/release-package.ts version "$PACKAGE_ID")"
          tag="$(pnpm exec tsx scripts/release-package.ts tag "$PACKAGE_ID")"
          branch="release/$PACKAGE_ID/v$version"

          if git ls-remote --exit-code --heads origin "$branch"; then
            echo "Release branch already exists: $branch" >&2
            exit 1
          fi

          git switch --create "$branch"
          {
            echo "branch=$branch"
            echo "package-id=$PACKAGE_ID"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release candidate
        run: pnpm check

      - name: Commit, push, and open pull request
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          PACKAGE_ID: ${{ steps.target.outputs.package-id }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          package_path="$(pnpm exec tsx scripts/release-package.ts package-path "$PACKAGE_ID")"
          git add -- "$package_path/package.json" pnpm-lock.yaml
          git diff --cached --quiet && {
            echo 'Bumpp did not change the release version.' >&2
            exit 1
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore($PACKAGE_ID): release v$VERSION"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore($PACKAGE_ID): release v$VERSION" \
            --body "Release candidate for \`$RELEASE_TAG\`. After this PR merges, create and push the matching annotated tag to publish it."
