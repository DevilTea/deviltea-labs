# Supply-chain security baseline retained from the source workspaces.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@deviltea/eslint-config'
  - '@deviltea/tsconfig'
blockExoticSubdeps: true
strictDepBuilds: true
shellEmulator: true
trustPolicy: no-downgrade
packages:
  - 'packages/*'
  - 'docs/*'

catalog:
  '@antfu/eslint-config': 9.1.0
  '@clack/prompts': ^0.10.1
  '@shikijs/vitepress-twoslash': ^3.23.0
  '@types/node': ^24.13.2
  '@vitest/coverage-v8': ^4.1.9
  bumpp: 11.1.0
  eslint: 10.6.0
  lint-staged: ^15.5.2
  pathe: ^2.0.3
  publint: ^0.3.21
  rimraf: ^6.1.3
  simple-git-hooks: ^2.13.1
  tsdown: ^0.22.3
  tsx: ^4.23.0
  typescript: ^6.0.3
  unplugin-vue: ^7.2.0
  vite: ^7.3.6
  vitepress: 2.0.0-alpha.17
  vitepress-plugin-group-icons: ^1.7.5
  vitest: ^4.1.9
  vue: ^3.5.39
  vue-router: 5.1.0
  vue-tsc: ^3.3.6
  zx: ^8.8.5

ignoredBuiltDependencies:
  - esbuild
  - simple-git-hooks
  - unrs-resolver
onlyBuiltDependencies: []
